<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wiki-Explorer Pro: Ultra-fast Wikipedia exploration with virtualized scrolling and loose search toggles.">
    <title>Wiki-TermScraper | v3.2 Advanced Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }

        body {
            background-color: var(--bg-dark);
            /* Gradient added to the background center as requested */
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 70%);
            background-attachment: fixed;
            color: #f1f5f9;
            overflow-x: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .wiki-iframe-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        .wiki-iframe {
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.4s ease-in-out;
        }

        .view-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        .view-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .view-list .wiki-iframe-container { height: 300px; }

        @media (max-width: 640px) {
            .view-grid { grid-template-columns: 1fr; }
        }

        .glass { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
        }

        .card-glow:hover {
            box-shadow: 0 0 20px -5px var(--accent-glow);
            border-color: var(--accent);
        }

        .filter-btn.active {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .toggle-active {
            background-color: #3b82f6;
            color: white;
        }

        /* Performance Optimizations */
        .rendering-placeholder {
            background: linear-gradient(110deg, #1e293b 8%, #334155 18%, #1e293b 33%);
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }

        @keyframes shine {
            to { background-position-x: -200%; }
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0 1.5rem 0;
        }
        .section-header::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, #334155, transparent);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header id="mainHeader" class="sticky top-0 z-40 glass border-b border-slate-800">
            <div class="max-w-7xl mx-auto p-4 flex flex-col gap-4">
                <div class="flex flex-col lg:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-900/40">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        </div>
                        <h1 class="text-xl font-bold tracking-tight whitespace-nowrap">Wiki Explorer <span class="bg-blue-500/10 text-blue-500 px-2 py-0.5 rounded text-[10px] uppercase ml-1">v3.2 Advanced</span></h1>
                    </div>

                    <div class="flex flex-col sm:flex-row w-full lg:w-auto gap-3 items-center">
                        <!-- Loose Search Toggle -->
                        <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-700 w-full sm:w-auto">
                            <button id="strictToggle" onclick="setSearchMode('strict')" class="flex-1 sm:flex-none px-3 py-1.5 text-[10px] font-bold uppercase rounded-lg transition-all toggle-active">Strict</button>
                            <button id="looseToggle" onclick="setSearchMode('loose')" class="flex-1 sm:flex-none px-3 py-1.5 text-[10px] font-bold uppercase rounded-lg transition-all text-slate-500 hover:text-slate-300">Loose</button>
                        </div>

                        <div class="relative flex-1 group w-full">
                            <input 
                                type="text" 
                                id="searchInput" 
                                placeholder="What would you like to explore?" 
                                class="w-full lg:w-80 bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none text-white transition-all group-hover:border-slate-600"
                                onkeypress="if(event.key === 'Enter') startSearch()"
                            >
                        </div>
                        <button 
                            onclick="startSearch()"
                            class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/30 active:scale-95 whitespace-nowrap"
                        >
                            Explore
                        </button>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-700">
                            <button onclick="setView('grid')" id="btnGrid" class="p-2 rounded-lg transition-colors bg-slate-800 text-white" title="Grid View"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 00-1 1v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2zM11 13a2 2 0 00-1 1v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2h-2z"></path></svg></button>
                            <button onclick="setView('list')" id="btnList" class="p-2 rounded-lg transition-colors text-slate-500 hover:text-white" title="List View"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg></button>
                        </div>
                        <button onclick="toggleSettings()" class="p-2.5 bg-slate-900/80 border border-slate-700 rounded-xl hover:text-blue-400 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                </div>

                <div id="filterSystem" class="flex flex-wrap items-center gap-2 border-t border-slate-800/50 pt-2 overflow-x-auto pb-1 no-scrollbar">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mr-1">Quick Filters:</span>
                    <button onclick="applyFilter('Science')" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-xs text-slate-400 hover:bg-slate-700 transition-all">Science</button>
                    <button onclick="applyFilter('History')" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-xs text-slate-400 hover:bg-slate-700 transition-all">History</button>
                    <button onclick="applyFilter('Geography')" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-xs text-slate-400 hover:bg-slate-700 transition-all">Geography</button>
                    <button onclick="applyFilter('Technology')" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-xs text-slate-400 hover:bg-slate-700 transition-all">Technology</button>
                    <button onclick="applyFilter('Arts')" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-xs text-slate-400 hover:bg-slate-700 transition-all">Arts</button>
                    <button onclick="applyFilter('Sports')" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-xs text-slate-400 hover:bg-slate-700 transition-all">Sports</button>
                    <div class="h-4 w-px bg-slate-700 mx-2"></div>
                    <button onclick="clearFilter()" class="text-[10px] text-red-400 hover:underline uppercase font-bold tracking-tight">Reset</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="scrollContainer" class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full relative">
            
            <!-- Knowledge Vault -->
            <div id="favoritesSection" class="hidden mb-16">
                <div class="section-header">
                    <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                        <svg class="w-5 h-5 fill-amber-400" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                        Knowledge Vault
                    </h2>
                </div>
                <div id="favoritesGrid" class="view-grid"></div>
            </div>

            <!-- Search Results -->
            <div id="resultsSection">
                <div id="resultsHeader" class="section-header hidden">
                    <h2 id="resultsTitle" class="text-xl font-bold text-slate-300">Exploration Results</h2>
                </div>
                <div id="resultsGrid" class="view-grid">
                    <!-- Initial State -->
                    <div id="emptyState" class="col-span-full py-40 text-center opacity-30 select-none">
                        <svg class="w-24 h-24 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <p class="text-2xl font-light">Your global library is waiting...</p>
                    </div>
                </div>
            </div>

            <!-- Loader -->
            <div id="infiniteLoader" class="hidden py-10 flex justify-center w-full">
                <div class="flex flex-col items-center gap-3">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500"></div>
                    <p class="text-xs text-slate-500 font-mono uppercase">Optimizing Render Tree...</p>
                </div>
            </div>
        </main>

        <!-- Fixed Status Bar -->
        <div id="statusBar" class="fixed bottom-4 right-4 translate-y-20 transition-transform bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-2xl z-50">
            Fetching data...
        </div>

        <!-- Sidebar -->
        <div id="settingsOverlay" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm" onclick="toggleSettings()"></div>
        <div id="settingsPanel" class="fixed top-0 right-0 h-full w-80 bg-slate-900 border-l border-slate-800 z-[60] p-6 translate-x-full shadow-2xl transition-transform duration-300 ease-out overflow-y-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xl font-bold">Settings</h2>
                <button onclick="toggleSettings()" class="p-2 hover:bg-slate-800 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="space-y-6">
                <div class="flex items-center justify-between p-4 bg-slate-800/50 rounded-2xl border border-slate-700/50">
                    <div>
                        <p class="font-semibold text-sm">Performance Mode</p>
                        <p class="text-[10px] text-slate-500">Auto-unrender hidden content</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="perfToggle" class="sr-only peer" checked>
                        <div class="w-10 h-5 bg-slate-600 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-5"></div>
                    </label>
                </div>

                <div class="p-4 bg-slate-800/50 rounded-2xl border border-slate-700/50">
                    <div class="flex justify-between items-center mb-3">
                        <p class="font-semibold text-sm">Search History</p>
                        <button onclick="clearHistory()" class="text-[10px] text-red-400 font-bold uppercase">Clear</button>
                    </div>
                    <div id="memoryList" class="space-y-1 max-h-48 overflow-y-auto pr-1"></div>
                </div>

                <div class="p-4 bg-red-950/10 border border-red-900/30 rounded-2xl">
                    <p class="font-bold text-red-400 text-xs mb-3 uppercase tracking-wider">Storage Cleanup</p>
                    <button onclick="clearAllData()" class="w-full py-2.5 bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white rounded-xl text-xs font-bold transition-all border border-red-900/40">
                        Wipe App Cache
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Viewer -->
    <div id="fullscreenModal" class="hidden fixed inset-0 z-[100] bg-slate-950 flex flex-col">
        <div class="p-3 flex justify-between items-center bg-slate-900 border-b border-slate-800">
            <h2 id="modalTitle" class="font-bold text-sm truncate max-w-[60%] text-slate-200">Page Preview</h2>
            <div class="flex items-center gap-1">
                <button id="modalFavBtn" class="p-2 hover:bg-slate-800 rounded-lg transition-colors text-slate-500"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg></button>
                <button onclick="closeFullscreen()" class="p-2 hover:bg-red-500/20 hover:text-red-500 rounded-lg transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
        </div>
        <div class="flex-1 bg-white">
            <iframe id="modalIframe" class="w-full h-full border-none"></iframe>
        </div>
    </div>

    <script>
        // --- State Management ---
        let viewMode = 'grid';
        let searchMode = 'strict'; // 'strict' or 'loose'
        let currentQuery = '';
        let isFetching = false;
        let history = JSON.parse(localStorage.getItem('wiki_history_v31') || '[]');
        let favorites = JSON.parse(localStorage.getItem('wiki_favs_v31') || '{}');

        // --- PERFORMANCE: Virtualizing Observer ---
        const perfObserver = new IntersectionObserver((entries) => {
            const isPerfMode = document.getElementById('perfToggle').checked;
            
            entries.forEach(entry => {
                const iframe = entry.target;
                const src = iframe.getAttribute('data-src');

                if (entry.isIntersecting) {
                    if (iframe.src === 'about:blank' || !iframe.src) {
                        iframe.src = src;
                        iframe.classList.add('loading-pulse');
                    }
                } else if (isPerfMode) {
                    if (iframe.src !== 'about:blank') {
                        iframe.src = 'about:blank';
                    }
                }
            });
        }, { 
            rootMargin: '400px', 
            threshold: 0.01 
        });

        // --- Initialization ---
        window.onload = () => {
            renderHistory();
            renderFavorites();
            setView('grid');
        };

        function setSearchMode(mode) {
            searchMode = mode;
            const sBtn = document.getElementById('strictToggle');
            const lBtn = document.getElementById('looseToggle');
            
            if (mode === 'strict') {
                sBtn.classList.add('toggle-active');
                sBtn.classList.remove('text-slate-500');
                lBtn.classList.remove('toggle-active');
                lBtn.classList.add('text-slate-500');
            } else {
                lBtn.classList.add('toggle-active');
                lBtn.classList.remove('text-slate-500');
                sBtn.classList.remove('toggle-active');
                sBtn.classList.add('text-slate-500');
            }
        }

        function setView(mode) {
            viewMode = mode;
            const resGrid = document.getElementById('resultsGrid');
            const favGrid = document.getElementById('favoritesGrid');
            const bGrid = document.getElementById('btnGrid');
            const bList = document.getElementById('btnList');

            [resGrid, favGrid].forEach(g => g.className = mode === 'grid' ? 'view-grid' : 'view-list');
            
            if(mode === 'grid') {
                bGrid.classList.add('bg-slate-800', 'text-white');
                bGrid.classList.remove('text-slate-500');
                bList.classList.remove('bg-slate-800', 'text-white');
                bList.classList.add('text-slate-500');
            } else {
                bList.classList.add('bg-slate-800', 'text-white');
                bList.classList.remove('text-slate-500');
                bGrid.classList.remove('bg-slate-800', 'text-white');
                bGrid.classList.add('text-slate-500');
            }
        }

        function applyFilter(category) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.toggle('active', b.innerText === category);
            });
            document.getElementById('searchInput').value = category;
            startSearch();
        }

        function clearFilter() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('searchInput').value = '';
        }

        async function startSearch() {
            const val = document.getElementById('searchInput').value.trim();
            if(!val || isFetching) return;

            currentQuery = val;
            isFetching = true;
            
            const grid = document.getElementById('resultsGrid');
            const status = document.getElementById('statusBar');
            const loader = document.getElementById('infiniteLoader');
            const resultsTitle = document.getElementById('resultsTitle');
            
            grid.innerHTML = '';
            const empty = document.getElementById('emptyState');
            if (empty) empty.remove();
            
            document.getElementById('resultsHeader').classList.remove('hidden');
            resultsTitle.innerText = searchMode === 'loose' ? `Deep Exploration: ${val}` : `Exploration Results: ${val}`;
            
            loader.classList.remove('hidden');
            status.innerText = searchMode === 'loose' ? `Running Full-Text Scan...` : `Parsing ${val}...`;
            status.classList.remove('translate-y-20');

            try {
                let titles = [];
                let links = [];

                if (searchMode === 'loose') {
                    // LOOSE SEARCH: Use Search index endpoint
                    const url = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(val)}&format=json&origin=*&srlimit=15&srprop=snippet`;
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data.query && data.query.search) {
                        titles = data.query.search.map(s => s.title);
                        links = titles.map(t => `https://en.wikipedia.org/wiki/${encodeURIComponent(t)}`);
                    }
                } else {
                    // STRICT SEARCH: Use Opensearch (Direct)
                    const url = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(val)}&limit=20&namespace=0&format=json&origin=*`;
                    const response = await fetch(url);
                    const data = await response.json();
                    titles = data[1];
                    links = data[3];
                }

                if(titles.length === 0) {
                    grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-500 font-medium">No knowledge paths found for "${val}" in ${searchMode} mode.</div>`;
                } else {
                    titles.forEach((t, i) => {
                        const card = createCard(t, links[i]);
                        grid.appendChild(card);
                    });
                }
                
                history = [val, ...history.filter(h => h !== val)].slice(0, 10);
                localStorage.setItem('wiki_history_v31', JSON.stringify(history));
                renderHistory();

            } catch (e) {
                console.error(e);
                status.innerText = "Fetch Error";
            } finally {
                isFetching = false;
                loader.classList.add('hidden');
                setTimeout(() => status.classList.add('translate-y-20'), 2000);
            }
        }

        function createCard(title, link) {
            const mLink = link.replace('en.wikipedia.org', 'en.m.wikipedia.org');
            const card = document.createElement('div');
            card.className = `bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden flex flex-col group card-glow transition-all duration-300`;
            card.dataset.title = title;

            const isFav = !!favorites[title];

            card.innerHTML = `
                <div class="p-4 flex items-center justify-between bg-slate-900/40 border-b border-slate-800">
                    <h3 class="font-bold text-sm truncate flex-1 pr-2 text-slate-200" title="${title}">${title}</h3>
                    <div class="flex items-center gap-1">
                        <button onclick="toggleFavorite('${title.replace(/'/g, "\\'")}', '${link}')" 
                                class="fav-trigger p-1.5 rounded-lg hover:bg-slate-800 transition-colors ${isFav ? 'text-amber-400' : 'text-slate-600'}">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                        </button>
                        <button onclick="openFullscreen('${mLink}', '${title.replace(/'/g, "\\'")}')" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-500 hover:text-blue-400 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="wiki-iframe-container rendering-placeholder">
                    <iframe 
                        src="about:blank" 
                        data-src="${mLink}" 
                        class="wiki-iframe opacity-0"
                        onload="this.classList.remove('opacity-0'); this.parentElement.classList.remove('rendering-placeholder');"
                    ></iframe>
                </div>
            `;
            
            perfObserver.observe(card.querySelector('iframe'));
            return card;
        }

        function toggleFavorite(title, link) {
            if(favorites[title]) delete favorites[title];
            else favorites[title] = { title, link, time: Date.now() };
            
            localStorage.setItem('wiki_favs_v31', JSON.stringify(favorites));
            
            document.querySelectorAll(`[data-title="${title}"] .fav-trigger`).forEach(btn => {
                btn.classList.toggle('text-amber-400', !!favorites[title]);
                btn.classList.toggle('text-slate-600', !favorites[title]);
            });

            renderFavorites();
        }

        function renderFavorites() {
            const grid = document.getElementById('favoritesGrid');
            const section = document.getElementById('favoritesSection');
            const keys = Object.keys(favorites);

            if(keys.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            grid.innerHTML = '';
            keys.sort((a,b) => favorites[b].time - favorites[a].time).forEach(k => {
                grid.appendChild(createCard(favorites[k].title, favorites[k].link));
            });
        }

        function renderHistory() {
            const list = document.getElementById('memoryList');
            if(history.length === 0) {
                list.innerHTML = `<p class="text-[10px] italic text-slate-600 py-2">No past logs found.</p>`;
                return;
            }
            list.innerHTML = history.map(h => `
                <div class="flex items-center group">
                    <button onclick="historySearch('${h}')" class="flex-1 text-left text-xs py-1.5 px-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors truncate">
                        ${h}
                    </button>
                </div>
            `).join('');
        }

        function historySearch(val) {
            document.getElementById('searchInput').value = val;
            startSearch();
            toggleSettings();
        }

        function toggleSettings() {
            const p = document.getElementById('settingsPanel');
            const o = document.getElementById('settingsOverlay');
            const isOpen = !p.classList.contains('translate-x-full');
            p.classList.toggle('translate-x-full', isOpen);
            o.classList.toggle('hidden', isOpen);
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('wiki_history_v31');
            renderHistory();
        }

        function clearAllData() {
            if(confirm("Destroy all saved favorites and cache?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function openFullscreen(url, title) {
            const m = document.getElementById('fullscreenModal');
            const i = document.getElementById('modalIframe');
            document.getElementById('modalTitle').innerText = title;
            i.src = url;
            m.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            const fBtn = document.getElementById('modalFavBtn');
            const updateIcon = () => {
                fBtn.classList.toggle('text-amber-400', !!favorites[title]);
                fBtn.classList.toggle('text-slate-500', !favorites[title]);
            };
            updateIcon();
            fBtn.onclick = () => {
                const baseLink = url.replace('en.m.wikipedia.org', 'en.wikipedia.org');
                toggleFavorite(title, baseLink);
                updateIcon();
            };
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.add('hidden');
            document.getElementById('modalIframe').src = 'about:blank';
            document.body.style.overflow = '';
        }

        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            const header = document.getElementById('mainHeader');
            if (currentScroll > 100) {
                header.classList.add('shadow-2xl', 'bg-slate-950/95');
            } else {
                header.classList.remove('shadow-2xl', 'bg-slate-950/95');
            }
        });
    </script>
</body>
</html>
